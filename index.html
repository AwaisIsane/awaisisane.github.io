  <style>
    :root {
      --ink: #0b0b0b;
      --paper: #fafaf8;
      --dim: #9a9a95;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Cormorant Garamond", serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 50% 38%, rgba(11,11,11,.018), transparent 60%);
    }

    .calm {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 40px;
      text-align: center;
      margin-top: 7vh;
    }

    .name {
      font-family: "Pinyon Script", cursive;
      font-size: clamp(64px, 12vw, 184px);
      font-weight: 400;
      line-height: .92;
      letter-spacing: .01em;
    }

    .hair {
      width: 54px;
      height: 1px;
      background: var(--ink);
      opacity: .45;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dot { color: var(--dim); font-size: 18px; user-select: none; }

    .link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
      transition: transform .16s cubic-bezier(.2,.7,.3,1);
      will-change: transform;
      padding: 6px 4px;
    }

    .link__label {
      position: relative;
      display: inline-block;
      padding-bottom: 5px;
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 500;
      letter-spacing: .36em;
      text-transform: uppercase;
      text-indent: .36em;
    }

    .link__label::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      height: 1px; width: 100%;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .35s cubic-bezier(.2,.7,.3,1);
    }

    .link.mag--on .link__label::after { transform: scaleX(1); }

    .connect {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .connect__mail {
      display: inline-block;
      text-decoration: none;
      color: inherit;
      transition: transform .16s cubic-bezier(.2,.7,.3,1);
      will-change: transform;
      padding: 4px 6px;
    }

    .connect__line {
      position: relative;
      display: inline-block;
      padding-bottom: 5px;
      font-style: italic;
      font-size: clamp(18px, 1.9vw, 23px);
      color: #222220;
      max-width: 520px;
      text-align: center;
      line-height: 1.45;
      transition: color .3s ease;
    }

    .connect__line::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      height: 1px; width: 100%;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .4s cubic-bezier(.2,.7,.3,1);
    }

    .connect__mail.mag--on .connect__line { color: var(--ink); }
    .connect__mail.mag--on .connect__line::after { transform: scaleX(1); }

    .foot {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      padding: 0 24px 42px;
    }

    .quote {
      appearance: none;
      background: none;
      border: 0;
      cursor: pointer;
      max-width: 600px;
      text-align: center;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .42s ease, transform .42s ease;
    }

    .quote.show { opacity: 1; transform: translateY(0); }

    .quote__mark { font-size: 34px; line-height: 0; height: 14px; color: var(--dim); }

    .quote__text {
      font-style: italic;
      font-size: clamp(16px, 1.6vw, 20px);
      line-height: 1.5;
      color: #3a3a37;
      text-wrap: pretty;
    }

    .quote__src {
      font-family: "Space Mono", monospace;
      font-size: 10.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .quote:hover .quote__src { color: var(--ink); }

    @media (max-width: 560px) {
      .links { flex-direction: column; gap: 14px; }
      .dot { display: none; }
      .foot { padding-bottom: 28px; }
    }

    @media (max-width: 390px) {
      .calm {
        padding: 20px;

      }

      }
      .foot { padding-bottom: 16px; }
      .quote__text { font-size: clamp(13px, 3.6vw, 16px); }
    }

    // ── Quote rotation ────────────────────────────────────────────────────────
    const quoteBtn  = document.getElementById('quote-btn');
    const quoteText = document.getElementById('quote-text');
    const quoteSrc  = document.getElementById('quote-src');
    let idx = Math.floor(Math.random() * QUOTES.length);
    let timer;

    function renderQuote() {
      quoteText.textContent = QUOTES[idx].quote;
      quoteSrc.textContent  = '— ' + QUOTES[idx].source;
    }

    function advance() {
      quoteBtn.classList.remove('show');
      clearTimeout(timer);
      setTimeout(() => {
        let n = idx;
        while (n === idx) n = Math.floor(Math.random() * QUOTES.length);
        idx = n;
        renderQuote();
        quoteBtn.classList.add('show');
        timer = setTimeout(advance, 9000);
      }, 420);
    }

    renderQuote();
    requestAnimationFrame(() => {
      quoteBtn.classList.add('show');
      timer = setTimeout(advance, 9000);
    });

    quoteBtn.addEventListener('click', advance);

    // ── Magnetic effect ───────────────────────────────────────────────────────
    const stage  = document.getElementById('stage');
    const K      = 0.45 * 0.6;
    const GROW   = 0.12 * 0.6;
    const RADIUS = 180;
    let raf = null;

    const mags = Array.from(document.querySelectorAll('[data-mag]'));

    stage.addEventListener('pointermove', (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        mags.forEach((el) => {
          const r     = el.getBoundingClientRect();
          const cx    = r.left + r.width  / 2;
          const cy    = r.top  + r.height / 2;
          const dx    = e.clientX - cx;
          const dy    = e.clientY - cy;
          const dist  = Math.hypot(dx, dy) || 0.001;
          const repel = el.dataset.mag === 'repel';
          if (dist < RADIUS) {
            const f     = 1 - dist / RADIUS;
            const sign  = repel ? -1 : 1;
            const scale = repel ? 1 - GROW * f * 0.4 : 1 + GROW * f;
            el.style.transform = `translate(${dx * K * sign}px,${dy * K * sign}px) scale(${scale})`;
            el.classList.toggle('mag--on', !repel);
          } else {
            el.style.transform = '';
            el.classList.remove('mag--on');
          }
        });
      });
    });

    stage.addEventListener('pointerleave', () => {
      mags.forEach((el) => { el.style.transform = ''; el.classList.remove('mag--on'); });
    });
